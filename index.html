<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Command Knowledge Base</title>
    
    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h2>Linux Command Knowledge Base</h2>
        <input type="text" id="search" placeholder="Search by command, keyword, or description..." onkeyup="searchCommands()">

        <table id="commandsTable">
            <thead>
                <tr>
                    <th style="width: 40%;">Command</th>
                    <th style="width: 60%;">Syntax</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data loads here -->
            </tbody>
        </table>
    </div>

</body>
</html>
